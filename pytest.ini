[pytest]
# Restrict collection to newton_raphson.py explicitly. This repository
# also contains mycode/setup.py (which would execute setuptools' setup()
# on import) and various notebook/example folders that are not meant to
# be collected as test modules.
testpaths = newton_raphson.py
addopts = --doctest-modules
doctest_optionflags = ELLIPSIS NORMALIZE_WHITESPACE
