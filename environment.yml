name: introduction-to-python
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - sympy
  - scipy
  - pandas
  - ipython
  - matplotlib
  - openpyxl
  - fortran-magic
  - gfortran  # actual Fortran compiler needed at runtime by the %%fortran cell magic
  - bokeh
  - cython
  - numba
  - widgetsnbextension
  - pip
  - pip:
    - -r requirements.txt
