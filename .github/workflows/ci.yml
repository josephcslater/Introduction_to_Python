name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  doctests:
    name: Run doctests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt numpy matplotlib

      - name: Run pytest
        run: pytest -q

  binder-environment:
    name: Verify Binder environment builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the exact conda/pip environment Binder (and students,
      # per docs/SETUP.rst) use, as a smoke test that it still solves
      # and installs cleanly. This does not execute the course
      # notebooks: several of them intentionally demonstrate
      # %%bash/%%ruby/%%perl/%%fortran/etc. cell magics that require
      # system interpreters/compilers outside the scope of a
      # lightweight CI check.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""

      # environment.yml's "name:" is "base" (matching the single-command
      # "conda env update --file environment.yml" instructions in
      # docs/SETUP.rst, so students don't need to learn `conda activate`).
      # setup-miniconda special-cases the base env and won't apply
      # environment-file to it directly, so update it explicitly here,
      # exactly as students do.
      - name: conda env update --file environment.yml
        shell: bash -l {0}
        run: conda env update -n base --file environment.yml

      - name: Sanity-check core imports
        shell: bash -l {0}
        run: |
          python -c "import numpy, scipy, sympy, pandas, matplotlib, numba, cython, bokeh, openpyxl; print('core imports OK')"
